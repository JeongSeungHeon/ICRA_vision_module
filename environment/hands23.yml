name: hands23_ros2
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  # Qualify GPU packages by channel. Without the qualifiers, conda-forge can
  # satisfy the names with its old CUDA 11.2 builds even when pytorch-cuda
  # 11.8 is present.
  - pytorch::pytorch=2.0.0
  # The PyTorch conda channel labels the Torch 2.0.0 counterpart as 0.15.0
  # (PyPI labels the equivalent release 0.15.1). Pin the Python/CUDA build so
  # the solver cannot substitute a CPU or conda-forge CUDA 11.2 package.
  - pytorch::torchvision=0.15.0=py310_cu118
  - pytorch::pytorch-cuda=11.8
  - pytorch::pytorch-mutex=1.0=cuda
  # Build Detectron2 against the same CUDA version as PyTorch instead of the
  # host CUDA 13 toolkit.
  - nvidia::cuda-nvcc=11.8
  - nvidia::cuda-cudart-dev=11.8
  # cuda-cudart-dev 11.8 does not cap this transitive dependency, so current
  # solvers otherwise mix CUDA 13 CCCL/Thrust headers into the 11.8 toolchain.
  - nvidia::cuda-cccl=11.8
  # Detectron2 includes Torch's CUDAContext.h while building its extension.
  - nvidia::libcublas-dev=11.11.3.6
  - nvidia::libcusparse-dev=11.7.5.86
  - nvidia::libcusolver-dev=11.4.1.48
  # Keep the runtime companions on their CUDA 11 generation as well. Their
  # broad dependency metadata otherwise lets current solvers add CUDA 13
  # runtime packages to this CUDA 11.8 build environment.
  - nvidia::libcurand=10.3.0.86
  - nvidia::libcufile=1.9.1.3
  # MKL 2024.1+ removed an ITT symbol used by PyTorch 2.0's libtorch_cpu.
  - mkl=2023.1.0
  - numpy<2
  - pyyaml
  - ninja
  - packaging
  - setuptools<70
  - wheel
  # pip 25.3+ always isolates legacy setup.py builds. Detectron2 v0.6 needs
  # the already-installed torch package while its wheel is being built.
  - pip<25.3
  - pip:
      # Keep Pillow on PyPI: the old conda Pillow build conflicts with the
      # current torchvision/jpeg solver metadata.
      - pillow==9.5.0
      - opencv-python==4.10.0.84
      - parso
      - termcolor==2.4.0
      - tqdm
