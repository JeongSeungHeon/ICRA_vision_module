system:
  # 카메라별 fps가 비어 있을 때 DualSensorHub가 쓰는 기본 센서 FPS입니다.
  sensor_fps: 30

video_recording:
  web_ui:
    # true이면 기존 Flask web UI에서 config 선택 후 저장합니다.
    # false이면 web UI 없이 s 키 입력 시 바로 mp4를 저장합니다.
    enabled: false
  tactile_logging:
    # true이면 video recorder capture thread에서 frame과 같은 타임라인으로 tactile sidecar를 기록합니다.
    enabled: false
    # true이면 분석용 baseline-subtracted tactile 값을 CSV로 저장합니다.
    csv_enabled: false
    # true이면 Rerun .rrd 시각화 파일도 함께 저장합니다. rerun 패키지가 없으면 CSV만 저장합니다.
    rerun_enabled: false
    # true이면 Rerun viewer를 live로 띄웁니다. 기본은 파일 저장만 합니다.
    rerun_live: false

frames:
  height_axis:
    # 리프트 감지, hand clearance, grasp 후보 필터링에서 높이로 볼 robot base 축입니다.
    name: z
    # height_axis의 양의 방향을 위쪽으로 해석할지 정합니다.
    positive_direction: up

cameras:
  cam0:
    # DualSensorHub가 cam0 RealSense 장치를 열 때 사용할 serial입니다.
    serial: "148522072369"
    width: 640
    height: 480
    fps: 30
    # # cam0 color/depth stream 폭입니다. 실행 인자 --width가 있으면 런타임에 override됩니다.
    # width: 640
    # # cam0 color/depth stream 높이입니다. 실행 인자 --height가 있으면 런타임에 override됩니다.
    # height: 480
    # # cam0 stream FPS입니다. 실행 인자 --fps가 있으면 런타임에 override됩니다.
    # fps: 30
    depth_filters:
      spatial:
        # RealSense spatial depth filter 사용 여부입니다.
        enabled: true
        # spatial filter 강도입니다.
        magnitude: 2
        # spatial filter smoothing alpha입니다.
        smooth_alpha: 0.5
        # spatial filter edge 보존 delta입니다.
        smooth_delta: 20
      temporal:
        # RealSense temporal depth filter 사용 여부입니다.
        enabled: true
        # temporal filter smoothing alpha입니다.
        smooth_alpha: 0.4
        # temporal filter delta입니다.
        smooth_delta: 20
      hole_filling:
        # RealSense depth hole filling 사용 여부입니다.
        enabled: false
        # hole filling mode 값입니다.
        mode: 1
      bilateral:
        # RealSense filter 이후 meter 단위 depth image에 OpenCV bilateral filter를 적용할지 정합니다.
        enabled: true
        # bilateral filter radius입니다. 실제 kernel 크기는 2 * radius + 1입니다.
        radius: 2
        # depth 값 차이에 대한 sigma입니다. meter 단위 depth에 적용됩니다.
        sigma_color: 0.02
        # bilateral filter 공간 sigma입니다.
        sigma_space: 2.0
        # 이 값 이상의 depth는 invalid로 보고 filter 후에도 0으로 유지합니다.
        zfar: 100.0
  cam1:
    # DualSensorHub가 cam1 RealSense 장치를 열 때 사용할 serial입니다.
    serial: "327122075999"
    # cam1 color/depth stream 폭입니다. cam0와 같아야 하며 --width로 override됩니다.
    width: 640
    # cam1 color/depth stream 높이입니다. cam0와 같아야 하며 --height로 override됩니다.
    height: 480
    # cam1 stream FPS입니다. cam0와 같아야 하며 --fps로 override됩니다.
    fps: 30
    depth_filters:
      spatial:
        # cam1 spatial depth filter 사용 여부입니다.
        enabled: true
        # spatial filter 강도입니다.
        magnitude: 2
        # spatial filter smoothing alpha입니다.
        smooth_alpha: 0.5
        # spatial filter edge 보존 delta입니다.
        smooth_delta: 20
      temporal:
        # cam1 temporal depth filter 사용 여부입니다.
        enabled: true
        # temporal filter smoothing alpha입니다.
        smooth_alpha: 0.2
        # temporal filter delta입니다.
        smooth_delta: 20
      hole_filling:
        # cam1 depth hole filling 사용 여부입니다.
        enabled: false
        # hole filling mode 값입니다.
        mode: 1
      bilateral:
        # cam1 RealSense filter 이후 meter 단위 depth image에 OpenCV bilateral filter를 적용할지 정합니다.
        enabled: true
        # bilateral filter radius입니다. 실제 kernel 크기는 2 * radius + 1입니다.
        radius: 2
        # depth 값 차이에 대한 sigma입니다. meter 단위 depth에 적용됩니다.
        sigma_color: 0.02
        # bilateral filter 공간 sigma입니다.
        sigma_space: 2.0
        # 이 값 이상의 depth는 invalid로 보고 filter 후에도 0으로 유지합니다.
        zfar: 100.0

calibration:
  chain:
    cam0_to_robot_base:
      # cam0 좌표계를 robot base 좌표계로 변환하는 4x4 transform pickle입니다.
      file: camera_parameters/c0_to_robot.pckl
    cam1_to_cam0:
      # cam1 좌표계를 cam0 좌표계로 변환하는 transform 파일입니다.
      file: camera_parameters/rot_trans_c1.dat
      # cam1_to_cam0 파일의 translation 단위입니다.
      translation_unit: m

perception:
  synchronization:
    # cam0/cam1 frame pair로 허용할 최대 timestamp 차이입니다.
    max_pair_time_delta_sec: 0.03
    # fusion 단계에서 object/hand state가 오래됐는지 판단하는 timeout입니다.
    stale_timeout_sec: 0.30

  depth_completion:
    fdct:
      # 실행 인자로 지정하지 않았을 때 FDCT depth completion을 사용할지 정합니다.
      enabled: false
      # FDCT를 적용할 카메라 선택입니다. cam0, cam1, both, none 중 하나입니다.
      cameras: both
      # FDCT checkpoint 경로입니다.
      checkpoint: FDCT/TransCG.tar
      # FDCT 실행 device입니다. auto, cpu, cuda 등을 사용할 수 있습니다.
      device: auto
      # FDCT 네트워크 입력 폭입니다.
      net_width: 320
      # FDCT 네트워크 입력 높이입니다.
      net_height: 240
      # FDCT 전처리에서 유효 depth 최소값입니다.
      depth_min: 0.30
      # FDCT 전처리에서 유효 depth 최대값입니다.
      depth_max: 1.70
      # FDCT 입력 depth normalize scale입니다.
      depth_norm: 1.0
      # FDCT 입력 depth coefficient입니다.
      depth_coeff: 10.0
      # invalid depth 영역을 inpaint해서 FDCT에 넣을지 정합니다.
      inpaint: true
      # FDCT 출력 depth에 bilateral filter를 후처리로 적용할지 정합니다.
      bilateral_enabled: true
      # bilateral filter radius입니다.
      bilateral_radius: 2
      # bilateral filter 공간 sigma입니다.
      bilateral_sigma_space: 2.0
      # bilateral filter에서 far depth cutoff로 쓰는 값입니다.
      bilateral_zfar: 100.0
      # FDCT 실패 시 원본 RealSense depth로 계속 진행할지 정합니다.
      fallback_to_raw: true
      # FDCT raw/completed depth 통계를 출력할지 정합니다.
      debug_stats: false
      # FDCT 경고/통계를 몇 번마다 출력할지 정합니다.
      debug_every: 30

  object:
    # 기본은 classless FastSAM + runtime SAM3D template입니다.
    backend: sam3d
    # segmentation label이 없을 때 ObjectState에 넣을 fallback label입니다.
    target_label: cup
    # 선택된 segmentation confidence가 이 값 미만이면 object를 invalid 처리합니다.
    confidence_threshold: 0.15
    fastsam:
      model_name: external/sam-3d-objects/FastSAM-s.pt
      label: sam3d_object
      imgsz: 640
      conf: 0.4
      iou: 0.9
      device: cuda:0
      require_cuda: true
      half: false
      bboxes:
        cam0: [160, 120, 480, 360]
        cam1: [160, 120, 480, 360]
      min_bbox_size_px: 8
      stable_frames: 3
      min_mask_pixels: 300
      min_temporal_iou: 0.8
      capture_timeout_s: 30.0
      warmup_frames: 5
    hoi_detr_bbox:
      enabled: true
      # Shape-fitting ablation에서 fixed bbox를 유지할 유효 raw cloud 연속 frame 수입니다.
      raw_cloud_ready_frames: 4
      require_cuda: true
      device: cuda:0
      hand_score_threshold: 0.3
      first_object_score_threshold: 0.3
      hand_first_relation_threshold: 0.6
      nms_iou_threshold: 0.5
      padding_ratio: 0.10
      ema_alpha: 0.60
      # RTX 4090 positive HOI 프레임 benchmark(p95 약 0.176 s) 기반 값입니다.
      hold_timeout_s: 0.70
      result_age_timeout_s: 1.00
      max_input_hz: 2.20 # 2.20
    segmentation:
      # YOLOE segmentation weights/model 이름입니다. 실행 인자 --model이 있으면 override됩니다.
      model_name: yoloe-26l-seg.pt
      # YOLOE text prompt class 목록입니다. 실행 인자 --prompt가 있으면 override됩니다.
      prompt_classes: ["cup", "wine glass", "box-shaped snack", "bottle"]
      # segmentation inference image size입니다. 실행 인자 --imgsz가 있으면 override됩니다.
      imgsz: 640
      # YOLOE inference confidence threshold입니다. 실행 인자 --conf가 있으면 override됩니다.
      # conf: 0.15
      # NMS IoU threshold입니다. 실행 인자 --iou가 있으면 override됩니다.
      iou: 0.45
      # frame당 최대 detection 수입니다. 실행 인자 --max-det가 있으면 override됩니다.
      max_det: 100
      # Ultralytics device 문자열입니다. null이면 자동 선택입니다.
      device: null
      # class id 필터입니다. null이면 prompt 결과 전체를 사용합니다.
      classes: null
      # FP16 inference 사용 여부입니다.
      half: false
      # Ultralytics retina mask 옵션입니다.
      retina_masks: true
      # cup과 wine glass가 동시에 잡히면 confidence와 무관하게 wine glass mask를 선택합니다.
      prefer_wine_glass_over_cup: true
      # 특정 class를 우선 선택해야 할 때 사용할 class 이름 목록입니다.
      selection_class_names: ["wine glass", "box-shaped snack", "cup", "bottle"]
      preprocess:
        # segmentation 입력 영상 전처리 사용 여부입니다.
        enabled: false
        # 대비 보정 계수입니다.
        contrast_alpha: 1.0
        # 밝기 보정 offset입니다.
        brightness_beta: 0.0
        # gamma correction 값입니다.
        gamma: 1.0
        clahe:
          # CLAHE 적용 여부입니다.
          enabled: false
          # CLAHE clip limit입니다.
          clip_limit: 2.0
          # CLAHE tile grid 한 변 크기입니다.
          tile_grid_size: 8
    point_cloud:
      # object mask 안의 depth pixel을 몇 pixel 간격으로 샘플링할지 정합니다.
      stride: 2
      # 카메라별 object point cloud 최대 point 수입니다.
      max_points: 20000
      # object point cloud 생성 시 유효 depth 최소값입니다.
      min_depth_m: 0.10
      # object point cloud 생성 시 유효 depth 최대값입니다.
      max_depth_m: 1.70
      # 카메라별 cloud downsample voxel size입니다.
      per_camera_voxel_size_m: 0.005
      # outlier 제거 방식입니다.
      outlier_method: statistical
      # statistical outlier 제거에 사용할 이웃 개수입니다.
      outlier_nb_neighbors: 20
      # statistical outlier 제거 표준편차 비율입니다.
      outlier_std_ratio: 2.0
      # radius outlier 제거 반경입니다.
      outlier_radius_m: 0.01
      # radius 안 최소 이웃 수입니다.
      outlier_min_neighbors: 8
      # 카메라별 point 수가 이보다 적으면 object를 invalid 처리합니다.
      min_points_per_camera: 300
    # cam0/cam1 병합 후 downsample voxel size입니다.
    merged_voxel_size_m: 0.006

  fill_level_estimation:
    # 내용물이 비어 있다고 강제할지 정합니다.
    fillings_empty: true
    # container mask ROI의 좌우 shrink 비율입니다.
    roi_shrink_x: 0.18
    # ROI 상단 shrink 비율입니다.
    roi_shrink_top: 0.08
    # ROI 하단 shrink 비율입니다.
    roi_shrink_bottom: 0.05
    # vertical profile smoothing/neighbor 크기입니다.
    profile_k: 3
    # 내용물 상단 위치 추정 보정 pixel입니다.
    rice_top_bias_px: 5
    # 바닥 중심 pixel 추정 보정값입니다.
    bottom_center_offset_px: 5
    # fill 계산에 사용할 최소 depth입니다.
    min_depth_m: 0.05
    # fill 계산에 사용할 최대 depth입니다.
    max_valid_depth_m: 1.8
    # 특정 pixel depth를 읽을 때 주변 patch 반경의 절반 크기입니다.
    depth_patch_half: 4

  hand:
    detector:
      # MediaPipe hand detection 최소 confidence입니다.
      min_detection_confidence: 0.5
      # MediaPipe hand tracking 최소 confidence입니다.
      min_tracking_confidence: 0.5
      # 카메라별 검출할 최대 손 개수입니다.
      max_num_hands: 2
    depth_lifting:
      # hand keypoint 주변 depth patch 반경입니다.
      patch_radius: 2
      # hand keypoint를 3D로 lift할 때 유효 depth 최소값입니다.
      min_depth_m: 0.10
      # hand keypoint를 3D로 lift할 때 유효 depth 최대값입니다.
      max_depth_m: 2.00
      # hand pose를 valid로 볼 최소 3D keypoint 개수입니다.
      min_valid_keypoints: 4
    # palm center/normal 이동평균 window frame 수입니다.
    smoothing_window_frames: 2
    # 손 velocity EMA alpha입니다.
    velocity_alpha: 0.5
    # palm pose quality가 이 값 미만이면 hand를 invalid 처리합니다.
    min_pose_quality: 0.25
    handedness_selection:
      # 오른손 후보로 볼 카메라 id입니다.
      right_hand_camera: 1
      # 왼손 후보로 볼 카메라 id입니다.
      left_hand_camera: 0
      # 선택 카메라를 바꾸기 전 challenger가 유지되어야 하는 frame 수입니다.
      hysteresis_frames: 5
      # 현재 선택 hand가 잠깐 사라졌을 때 유지할 frame 수입니다.
      dropout_hold_frames: 4
      # challenger로 전환하기 위한 confidence margin입니다.
      confidence_drop_margin: 0.15
      # 같은 카메라가 이 frame 수만큼 연속 선택되면 이후 해당 카메라로 고정합니다.
      lock_after_stable_frames: 4
      # lock 이후 손이 잠깐 invalid가 되어도 마지막 selected hand를 유지합니다.
      lock_hold_last_on_dropout: true

  hand_selection:
    # active hand 후보 ID 생성 방식입니다. handedness이면 cam0:right/cam0:left처럼 MediaPipe handedness를 ID로 씁니다.
    candidate_identity_mode: handedness
    # active hand selection과 distance 계산에 참여할 후보 ID입니다. 오른손은 cam1, 왼손은 cam0 관측만 사용합니다.
    allowed_active_candidate_ids: ["cam0:left", "cam1:right"]
    # object center에서 이 거리 안으로 들어온 hand 후보만 active hand로 신규 선택합니다.
    active_hand_distance_threshold_m: 0.15
    # 다른 hand로 전환하려면 현재 hand보다 이 거리 이상 더 가까워야 합니다.
    switch_margin_m: 0.95
    # 전환 조건을 만족한 challenger가 연속 유지되어야 하는 frame 수입니다.
    switch_confirm_frames: 15
    # 현재 active hand가 사라졌을 때 마지막 선택을 유지하는 시간입니다.
    lost_timeout_s: 1000000000.5
    # handover task 중 active hand를 보수적으로 유지합니다.
    lock_active_hand_during_task: true
    # true이면 active hand가 실제로 바뀌는 순간 교체 기준과 거리 정보를 콘솔에 출력합니다.
    log_active_hand_switches: true
    # true이면 cam0:right/cam1:left/cam0:left/cam1:right 중 최종 active hand를 콘솔에 출력합니다.
    log_active_hand_selection: true
    # true이면 매 frame마다 출력합니다. false이면 active hand 또는 valid 상태가 바뀔 때만 출력합니다.
    log_active_hand_selection_every_frame: false

  fusion:
    # object centroid EMA alpha입니다. 수정 0.35  -> 0.6
    object_centroid_alpha: 1
    # hand center EMA alpha입니다. 수정 0.35 -> 0.6
    hand_center_alpha: 1
    # hand normal EMA alpha입니다.
    hand_normal_alpha: 0.50
    # position jump가 이보다 크면 smoothing state를 재초기화합니다.
    max_position_jump_m: 0.20
    # hand approach/activation을 확정할 연속 frame 수입니다.
    stable_frames_required: 5

  shape_fitting:
    # template 기반 shape fitting/ICP 사용 여부입니다.
    enabled: true
    sam3d:
      repo_path: external/sam-3d-objects
      checkpoint_config: checkpoints/hf/pipeline.yaml
      require_cuda: true
      compile: false
      seed: 42
      canonical_extent_m: 0.1
      robust_percentile: 1.0
      min_template_points: 100
      min_axis_extent_m: 0.0001
      template_id: sam3d_runtime
      scale_mode: axis_xyz
      # fixed FastSAM bbox에서 실제 silhouette 평가가 연속 성공해야 하는 횟수입니다.
      # 이 횟수 이후 scale을 동결하고 HOI-DETR dynamic bbox로 전환합니다.
      initial_silhouette_scaling_frames: 6
      artifact_root: output/sam3d
      z_rotation:
        enabled: true
        min_deg: -180.0
        max_deg: 180.0
        step_deg: 15.0
        coarse_to_fine:
          enabled: true
          coarse_step_deg: 30.0
          refine_radius_deg: 15.0
          refine_step_deg: 5.0
      axis_rotation_candidates:
        enabled: false
        roll_deg: [90.0, -90.0]
        pitch_deg: [90.0, -90.0]
    template_library:
      cup:
        # cup template 식별자입니다.
        template_id: cup_shape_fit
        # cup canonical point cloud 파일입니다.
        asset_path: shape_fitting/template.npy
        # template point 단위를 meter로 바꾸는 scale입니다.
        unit_scale_m: 0.001
        # cup도 template local x/y/z 축별 scale을 따로 적용합니다.
        scale_mode: axis_xyz
      wine glass:
        # wine glass template 식별자입니다.
        template_id: wine_glass_shape_fit
        # wine glass canonical point cloud 파일입니다.
        asset_path: shape_fitting/wine_glass.npy
        # template point 단위를 meter로 바꾸는 scale입니다.
        unit_scale_m: 0.001
        # wine glass도 template local x/y/z 축별 scale을 따로 적용합니다.
        scale_mode: axis_xyz
      bottle:
        # bottle template 식별자입니다.
        template_id: bottle_shape_fit
        # bottle canonical point cloud 파일입니다.
        asset_path: shape_fitting/beer_bottle.npy
        # template point 단위를 meter로 바꾸는 scale입니다.
        unit_scale_m: 0.001
        # bottle도 template local x/y/z 축별 scale을 따로 적용합니다.
        scale_mode: axis_xyz
      box-shaped snack:
        # box-shaped snack template 식별자입니다.
        template_id: box_snack_shape_fit
        # box-shaped snack canonical point cloud 파일입니다.
        asset_path: shape_fitting/poteau.npy
        # template point 단위를 meter로 바꾸는 scale입니다.
        unit_scale_m: 0.001
        # box-shaped snack은 template local x/y/z 축별 scale을 따로 적용합니다.
        scale_mode: axis_xyz
        z_rotation:
          # box-shaped snack에만 Z축 yaw 후보 탐색을 적용합니다.
          enabled: true
          # yaw 후보 최소 각도입니다.
          min_deg: -90.0
          # yaw 후보 최대 각도입니다.
          max_deg: 90.0
          # yaw 후보 간격입니다.
          step_deg: 5.0
          coarse_to_fine:
            # roll/pitch 후보별로 coarse yaw를 먼저 고르고 주변만 refine합니다.
            enabled: true
            # coarse yaw 후보 간격입니다.
            coarse_step_deg: 15.0
            # coarse best yaw 주변 refine 반경입니다.
            refine_radius_deg: 10.0
            # refine yaw 후보 간격입니다.
            refine_step_deg: 5.0
        axis_rotation_candidates:
          # box-shaped snack에만 roll/pitch 90도 축 전환 후보를 추가합니다.
          enabled: true
          # roll 후보입니다. pitch와 동시에 적용하지 않습니다.
          roll_deg: [90.0, -90.0]
          # pitch 후보입니다. roll과 동시에 적용하지 않습니다.
          pitch_deg: [90.0, -90.0]
    cluster:
      # DBSCAN cluster 반경입니다.
      dbscan_eps_m: 0.02
      # DBSCAN core point 최소 이웃 수입니다.
      dbscan_min_points: 10
      # 선택 cluster centroid가 이전 frame 대비 허용되는 최대 jump입니다.
      max_cluster_jump_m: 0.08
    scale_init:
      # 기본 template scale 방식입니다. uniform 또는 axis_xyz를 사용할 수 있습니다.
      mode: uniform
      # scale 초기화에 필요한 안정 frame 수입니다.
      stable_frames: 8
      # object extent 계산 lower percentile입니다.
      percentile_low: 5.0
      # object extent 계산 upper percentile입니다.
      percentile_high: 95.0
      # template scale 최소값입니다.default 0.5
      min_scale: 0.5
      # template scale 최대값입니다. default 1.8
      max_scale: 1.8
    tracking:
      # cluster extent가 이보다 작으면 tracking invalid 처리합니다.
      min_cluster_extent_m: 1.0e-5
    icp:
      # ICP 입력에 사용할 최대 point 수입니다.
      max_points: 3500
      # ICP 최대 iteration 수입니다.
      max_iterations: 10
      # ICP correspondence 최대 거리입니다.
      distance_threshold_m: 0.15
      # ICP 결과를 valid로 볼 최소 fitness입니다.
      min_fitness: 0.02
      # ICP 수렴 translation tolerance입니다.
      translation_tolerance_m: 1.0e-5
      # ICP 결과 centroid jump 허용값입니다.
      max_centroid_jump_m: 3
      crop:
        # ICP 전에 target/source cloud 상단 일부를 crop할지 정합니다.
        enabled: true
        # crop 기준 높이 축 index입니다. 0=x, 1=y, 2=z입니다.
        height_axis_index: 2
        # target cloud에서 crop할 상단 fraction입니다.
        target_top_fraction: 0.05
        # crop 후 최소 point 수입니다.
        min_points_after_crop: 80
        # crop을 적용할 최소 높이 extent입니다.
        min_height_extent_m: 0.01
    downsample:
      # fitted output cloud downsample voxel size입니다.
      voxel_size_m: 0.004
      # fitted output cloud 최대 point 수입니다.
      max_points: 6000
    silhouette_constraint:
      # 투명 물체의 depth bleeding 때문에 template이 커지는 것을 막기 위한 2D mask rerank입니다.
      enabled: true
      # 아래 label에만 silhouette rerank를 적용합니다. apply_to_all을 true로 두면 전체 label에 적용됩니다.
      apply_to_labels: ["cup", "wine glass", "glass", "bottle"]
      apply_to_all: false
      # 3D robust loss, IoU loss, mask 밖 projection penalty, scale prior, temporal scale penalty 가중치입니다.
      lambda_3d: 0
      lambda_iou: 10.75
      lambda_outside: 10.8
      lambda_scale_prior: 0
      lambda_temporal: 0
      # projected template point를 간단히 splat/rasterize할 때 쓰는 pixel 설정입니다.
      point_radius_px: 2
      close_kernel_px: 5
      dilate_px: 1
      mask_erode_px: 0
      # 너무 작은 segmentation/rendering은 rerank evidence로 쓰지 않습니다.
      min_rendered_pixels: 30
      min_segmentation_pixels: 50
      # mask 밖으로 벗어난 projection의 distance-transform penalty truncation입니다.
      distance_trunc_px: 25.0
      # bleeding outlier가 3D loss를 지배하지 않도록 nearest-neighbor loss를 clipping합니다.
      robust_3d_trunc_m: 0.03
      observed_to_template_weight: 0.9
      robust_3d_max_points: 2000
      max_projection_points: 1500
      # scale rerank는 shrink 후보 위주로 만들고, 성장이 필요할 때도 작게만 허용합니다.
      growth_penalty: 1.0
      max_growth_factor: 1.05
      shrink_factors: [0.90, 0.95, 0.99]
      uniform_growth_factors: [1.0, 1.05]
      debug: true

  activation:
    # hand와 object 거리로 접근 상태를 판단하는 threshold입니다.
    hand_approach_distance_threshold_m: 0.15
    # object lift/activation 안정화에 필요한 frame 수입니다.
    stable_frames_required: 2

grasp:
  # fixed_orientation_base 해석 형식입니다.
  fixed_orientation_format: rpy
  # grasp target state에 쓰는 고정 EEF orientation 값입니다.
  fixed_orientation_base: [1.591, -0.017, 1.561]
  # object centroid 주변 grasp 후보 search radius입니다.
  candidate_search_radius_from_centroid_m: 0.11
  # 손 높이와 grasp 후보 사이 최소 clearance입니다.
  min_hand_height_clearance_m: 0.07
  # 후보가 없을 때 이전 target을 hold할지 invalid로 둘지 정합니다.
  no_candidate_action: hold
  hand_relative_fallback:
    # object 측정 dropout 때 hand-relative fallback을 사용할지 정합니다.
    enabled: true
    # fallback을 사용하기 전 필요한 task 누적 valid frame 수입니다.
    lock_frames: 1
    # task 누적 샘플 평균에서 축별 median 대비 이 거리 이상 튄 값은 제외합니다.
    anchor_outlier_threshold_m: 0.08
    # 측정이 끊겨도 fallback을 유지할 최대 시간입니다.
    max_dropout_sec: 3.0
    # fallback lock에 hand approach 상태를 요구할지 정합니다.
    require_hand_approach: false
    # fallback lock에 motion trigger 상태를 요구할지 정합니다.
    require_motion_triggered: true
    # hand-relative fallback lock/active 여부를 콘솔에 출력합니다.
    debug_log: false
    # lock_frames progress가 바뀔 때만 출력합니다.
    log_lock_progress: false
    # fallback active 로그를 몇 frame마다 출력할지 정합니다. 1이면 매 fallback frame 출력입니다.
    log_fallback_every_frames: 1
  target_selection:
    # temporal target selection/hold를 사용할지 정합니다.
    enabled: true
    # 새 후보로 전환하기 위한 score margin입니다.
    switch_margin: 0.01
    # 기존 후보를 유지할 최대 frame 수입니다.
    hold_frames: 6
    # 후보 dropout 시 이전 grasp target을 유지할 frame 수입니다.
    dropout_hold_frames: 8
    # 이전 후보와의 거리 penalty 가중치입니다.
    score_previous_distance_weight: 0.90
  z_stabilization:
    # true이면 grasp/object가 가까울 때 grasp point z만 max-step + EMA로 안정화합니다.
    enabled: true
    # base frame XY에서 EEF(wrist)와 grasp target 사이 거리가 이 값 이하일 때만 적용합니다.
    activation_dist_xy_m: 0.25
    # frame당 z 변화량 제한입니다.
    max_step_z_m: 0.005
    # 이전 filtered z에 곱하는 EMA alpha입니다.
    ema_alpha: 0.70

robot:
  return_sequence:
    # 놓을 물체 중심의 robot base-frame XY 목표입니다. 단위는 mm입니다.
    place_object_xy_mm: [400.0, 0.0]
    # false이면 grasp offset을 적용하지 않고 위 좌표를 최종 TCP XY로 직접 사용합니다.
    apply_grasp_offset_xy: false
    # true이면 PLACE 도착 후 gripper open 전에 아래 방향으로 한 번 더 이동합니다.
    pre_release_descend_enabled: true
    # gripper open 전 추가로 하강할 고정 거리이며 place Z의 release parameter와는 별개입니다.
    pre_release_descend_m: 0.02
    # gripper release 후 x backoff 전에 robot base +Z 방향으로 올릴 거리입니다.
    post_release_z_offset_m: -0.03
    # return_backoff moveL 이후 HOME moveJ로 넘어가기 전에 실제 정지를 확인합니다.
    post_backoff_stop_check_enabled: true
    # actual_tcp_speed linear norm이 이 값 이하이면 backoff 후 정지로 봅니다.
    post_backoff_stop_speed_threshold_mps: 0.002
    # backoff 후 정지 확인을 기다릴 최대 시간입니다.
    post_backoff_stop_timeout_s: 1.0
    # backoff 후 정지 확인 중 RTDE state/isSteady polling 주기입니다.
    post_backoff_stop_poll_dt_s: 0.01
    # true이면 backoff 후 정지 확인 실패 시 HOME moveJ로 진행하지 않고 sequence를 실패 처리합니다.
    post_backoff_stop_require_confirmed: false

  tactile:
    # true이면 AnySkin tactile reader를 시작하고 grasp/release 판단에 사용합니다.
    enabled: true
    # AnySkin serial port입니다.
    port: /dev/ttyACM0
    # AnySkin magnetometer 개수입니다.
    num_mags: 5
    # baseline 계산에 사용할 초기 sample 수입니다.
    baseline_samples: 5
    # stream 시작 후 baseline reset 전 대기 시간입니다.
    startup_delay_s: 1.0
    # baseline-subtracted tactile total norm이 이 값 이상이면 contact로 봅니다.
    contact_norm_threshold: 35.0
    # tactile contact position에서 gripper를 추가로 닫을 Robotiq position count입니다.
    extra_grasp_pos: 20
    # place/release 위치에서 held reference 대비 이 delta 이상이면 release timing으로 봅니다.
    release_delta_threshold: 30
    # grasp 성공 후 held tactile reference를 잡기 전 대기 시간입니다.
    release_ref_delay_s: 0.3
    # 고정 위치 release trigger 대기용 timeout입니다. tactile continuous descent에서는 min_z가 fallback 한계입니다.
    # release_timeout_s: 1.0
    # tactile release descent에서 허용할 최소 robot base Z입니다.
    release_descent_min_z_mm: 40.0
    # legacy step mode용 값입니다. 현재 single-target tactile release descent에서는 사용하지 않습니다.
    release_descent_step_mm: 2.0
    # tactile release descent 중 step 사이 tactile 확인 주기입니다.
    release_descent_poll_dt_s: 0.03
    # gripper open 후 tactile baseline을 다시 잡기 전 대기 시간입니다. 0이면 비활성입니다.
    auto_baseline_reset_after_open_s: 0
    # true이면 tactile release trigger 이후 stop command/actual stop timing을 자세히 출력합니다.
    release_stop_timing_debug: false
    # actual_tcp_speed linear norm이 이 값 이하이면 실제 정지로 기록합니다.
    release_stop_speed_threshold_mps: 0.002
    # stop command 이후 실제 정지를 관찰할 최대 시간입니다.
    release_stop_monitor_timeout_s: 1.0
    # 실제 정지 관찰 중 RTDE state/isSteady polling 주기입니다.
    release_stop_monitor_poll_dt_s: 0.005
    # tactile debug log 출력 여부입니다.
    debug: false

  live_follow:
    # robot_control_loop servo 주기입니다. 실행 인자 --control-hz가 있으면 override됩니다.
    control_hz: 30.0
    # z축까지 follow할지 정합니다. 실행 인자 --follow-z/--no-follow-z가 있으면 override됩니다.
    follow_z: true

  rtde:
    # UR robot IP입니다. 실행 인자 --robot-ip가 있으면 override됩니다.
    # robot_ip: 192.168.56.101
    # UR dashboard port입니다.
    dashboard_port: 29999
    # RTDE controller 내부 control 주기입니다.
    control_hz: 125
    # command watchdog timeout입니다.
    watchdog_timeout_sec: 0.50
    # RTDE 연결 실패 또는 라이브러리 없음 때 mock mode로 fallback할지 정합니다.
    use_mock_fallback: true
    # 실제 robot 연결 대신 mock mode를 강제할지 정합니다.
    force_mock: false
    # moveL을 async로 실행할지 정합니다.
    move_asynchronous: true
    # moveL acceleration입니다.
    move_acceleration: 0.75
    # servoL lookahead_time입니다.
    servo_lookahead_time: 0.10
    # servoL gain입니다.
    servo_gain: 300
    # stopL/stop motion acceleration입니다. 기본은 0.1입니다만, tactile release descent에서 빠르게 멈추기 위해 5.0으로 높였습니다.
    stop_acceleration: 10.0
  motion:
    # RtdeController blocking move 기본 속도입니다.
    approach_speed_mps: 0.35
    # RtdeController retreat 이동 속도입니다.
    retreat_speed_mps: 0.18
  gripper:
    # Robotiq gripper 제어 방식입니다. socket이면 UR Robotiq daemon을 사용합니다.
    control_mode: socket
    # gripper open 명령 문자열입니다.
    open_command: open
    # gripper close 명령 문자열입니다.
    close_command: close
    # Robotiq socket daemon port입니다.
    socket_port: 63352
    # gripper socket timeout입니다.
    socket_timeout_sec: 2.0
    # gripper socket command 후 안정화 대기입니다.
    socket_settle_time: 0.15
    # gripper socket 연결 시 activate 명령을 보낼지 정합니다.
    activate_on_connect: true
    # gripper open speed입니다.
    open_speed: 250 # 기존 255에서 100으로 낮춤
    # gripper open force입니다.
    open_force: 255
    # gripper close speed입니다.
    close_speed: 255
    # gripper close force입니다.
    close_force: 255
    # close 중 gripper position이 이 값 이상이면 완료로 봅니다.
    position_complete_threshold: 200
    position_stall_detection:
      # true이면 close 중 gripper position이 충분히 오래 거의 변하지 않을 때 완료로 봅니다.
      enabled: true
      # position 변화가 tolerance 이하인 상태가 이 read 수만큼 이어지면 stall로 봅니다.
      stable_reads_required: 3
      # 같은 position으로 볼 Robotiq position 정수값 허용 오차입니다.
      tolerance: 1
      # close 시작 직후 순간적인 동일 read를 무시하기 위한 최소 경과 시간입니다.
      min_elapsed_s: 0.12
    # grasp 직전 fitted template의 grasp z 단면 폭/지름으로 close 완료 position threshold를 계산합니다.
    position_threshold_geometry:
      # true이면 object label이 아니라 template 단면 geometry 기반 threshold를 사용합니다.
      enabled: true
      # threshold 계산식의 보정 폭입니다. 단위는 cm입니다.
      alpha_cm: -0.2
      # threshold 계산식의 gripper 최대 opening 상수입니다. 단위는 cm입니다.
      formula_opening_cm: 9.0
      # grasp z 주변 template point를 고를 단면 두께입니다.
      slice_band_m: 0.005
      # band slice를 유효하게 볼 최소 point 수입니다.
      min_slice_points: 8
      # band point가 부족할 때 z가 가까운 point를 이 개수만큼 사용합니다.
      fallback_nearest_points: 64
      # label별로 template local 축 기준 폭을 사용할 때의 축 이름입니다.
      local_width_axis_by_label:
        box-shaped snack: x
      # PCA 긴 변/짧은 변 비율이 이 값 이상이면 직사각 단면으로 보고 짧은 변을 폭으로 씁니다.
      anisotropic_ratio: 1.25
      # 계산된 position threshold 하한입니다.
      clamp_min: 0
      # 계산된 position threshold 상한입니다.
      clamp_max: 255
    # gripper/RTDE debug log 출력 여부입니다.
    debug: false
    # socket mode가 아닐 때 digital output domain입니다.
    output_domain: tool
    # socket mode가 아닐 때 open에 사용할 digital output index입니다.
    open_digital_output: 1
    # socket mode가 아닐 때 close에 사용할 digital output index입니다.
    close_digital_output: 0
    # digital output 활성 상태를 high로 둘지 정합니다.
    output_high_when_active: true
  grasp_verification:
    # grasp 검증에 TCP force를 사용할지 정합니다.
    use_tcp_force: true
    # grasp 검증에 joint current를 사용할지 정합니다.
    use_joint_current: true
    # grasp/contact로 볼 TCP force norm 최소값입니다.
    min_tcp_force_norm_n: 8.0
    # grasp로 볼 평균 joint current 최소값입니다.
    min_mean_joint_current_a: 0.15
    # force와 current 조건을 둘 다 만족해야 하는지 정합니다.
    require_both_signals: false
  frame_mapping:
    # project 좌표와 UR base 좌표 사이 sign mapping 적용 여부입니다.
    enabled: true
    # position mapping에 곱할 x/y/z sign입니다.
    position_signs: [-1.0, -1.0, 1.0]

runtime:
  sam3d_server:
    python_interpreter: /home/ur5/miniforge3/envs/sam3d-objects/bin/python
    repo_path: external/sam-3d-objects
    execution_mode: server
    server_socket: /tmp/handover_sam3d_stage1.sock
    server_ready_timeout_s: 120.0
    request_timeout_s: 120.0
    artifact_root: output/sam3d
    fastsam_bbox_file: output/sam3d/fastsam_bbox.yaml
    require_fastsam_bbox_selection: true
  hoi_detr_sidecar:
    python_interpreter: /home/ur5/miniforge3/envs/hoi_detr/bin/python
    repo_path: external/HOI-DETR
    config_path: external/HOI-DETR/projects/configs/co_dino_vit/co_dino_5scale_vit_large_coco_with_relation_only_all_losses_custom.py
    weights_path: external/checkpoints/epoch_5.pth
    socket: /tmp/handover_hoi_detr.sock
    startup_timeout_s: 120.0
    request_timeout_s: 10.0

safety:
  workspace_bounds_m:
    # robot base X clamp 범위입니다. 이 YAML 값으로만 조절합니다.
    x: [-0.20, 1.10]
    # robot base Y clamp 범위입니다. 이 YAML 값으로만 조절합니다.
    y: [-0.80, 0.80]
    # robot base Z clamp 범위입니다. 이 YAML 값으로만 조절합니다.
    z: [0.00, 0.80]
